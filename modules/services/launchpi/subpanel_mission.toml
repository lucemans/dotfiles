version = 5

[[panels]]
panel_id = "studio-panel-7"
name = "Mission"
dials = []

[panels.layout]
columns = 5
rows = 2

[panels.capabilities]
supports_color = true
supports_images = true
supports_text = true
supports_brightness = true
supports_haptics = false

[[panels.controls]]
control_id = "mission-overview"
name = "Overview"

[panels.controls.position]
column = 0
row = 0

[panels.controls.default_state]
is_pressed = false

[[panels.controls.default_state.layers]]
kind = "fill"

[panels.controls.default_state.layers.color]
red = 0
green = 0
blue = 0
alpha = 255

[[panels.controls.default_state.layers]]
kind = "image"
image = "mdi:view-dashboard"
fit = "contain"
anchor = "top_center"
scale_percent = 40
tint = "$(missiond.default:tabs.grafana-overview.color)"

[[panels.controls.default_state.layers]]
kind = "text"
text = "Overview"
color = "$(missiond.default:tabs.grafana-overview.color)"
anchor = "bottom_center"
font_size = 17

[[panels.controls.default_state.layers]]
kind = "border"
color = "$(missiond.default:tabs.grafana-overview.color)"
width = 5

[[panels.controls.action_bindings]]
gesture = "press"

[[panels.controls.action_bindings.actions]]
type = "invoke_integration"
integration_id = "missiond.default"
action_name = "activate_tab"

[panels.controls.action_bindings.actions.parameters]
tab_id = "grafana-overview"

