[package]
name = "github-reader"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "github-reader"
path = "src/main.rs"

[[bin]]
name = "github-reader-mcp"
path = "src/bin/github-reader-mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
missing_errors_doc = "allow"
redundant_pub_crate = "warn"
arbitrary_source_item_ordering = "deny"
